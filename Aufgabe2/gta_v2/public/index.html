<!DOCTYPE html>

<!-- File origin: VS1LAB A1a -->

<html lang="en">

<head>
    <!-- Leaflet CSS and JavaScript (in this order) -->
    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoTagApp</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
    <header class="header">
        <img src="./images/location.png" class="header__image" alt="an image of a map and location">
        <h1 class="header__title">GeoTagApp</h1>
        <nav class="header__navigation">
            <a href="#">About</a> | <a href="#">Help</a> | <a href="/">Home</a>
        </nav>
    </header>

    <main class="main row">
        <section class="main__tagging tagging col-4">
            <h2>Tagging</h2>

            <!-- ############### VS1Lab 1a Form 1 Start -->
            <form id="tag-form" action="/tagging" method="post">

                <!-- ... your code here ... -->
                 <fieldset>
                    <legend>Add a new Geotag</legend>
                    <label for="tag-latitude">Latitude</label>
                    <input type="text" id="tag-latitude" value="42" disabled>

                    <label for="tag-longitude">Longitude</label>
                    <input type="text" id="tag-longitude" value="25 " disabled>
                    
                    <label for="tag-name">Name</label>
                    <input type="text" id="tag-name" placeholder="e.g. Mensa Moltke" pattern="[A_Za-zÄÖÜöäüß]\s?[0-9]*+" maxlength="10" required>

                    <label for="tag-hashtag">Hashtag</label>
                    <input type="text" id="tag-hashtag" placeholder="e.g. #Käsebau" pattern="#[A-Za-zÄÖÜäöüß]" maxlength="11">

                    <input type="submit" id="tag-button" value="Add Tag">
                 </fieldset>
                

            </form>
            <!-- ############### VS1Lab 1a Form 1 End -->

        </section>

        <section class="main__discovery discovery col-8">
            <h2 class="discovery__title">Discovery</h2>

            <!-- ############### VS1Lab 1a Form 2 Start -->
            <form class="discovery__search" id="discoveryFilterForm" action="/discovery" method="post">

                <!-- ... your code here ... -->
                <fieldset>
                    <legend>Search</legend>
                    <label for="search-term">Search Term or Keyword</label>
                    <input type="text" id="search-term" placeholder="e.g. Karlsruhe">

                    <input type="submit" id="search-button" value="Search">

                    <input type="text" id="disc-latitude" value="42" disabled hidden>
                    <input type="text" id="disc-longitude" value="25" disabled hidden>
                </fieldset>
                

            </form>
            <!-- ############### VS1Lab 1a Form 2 End -->

            <div class="discovery__wrapper row">
                <div class="discovery__taglist col-4">
                    <ul class="discovery__results" id="discoveryResults">
                        <li>Castle (49.01379, 8.404435) #sight</li>
                        <li>IWI (49.01379, 8.390071) #edu</li>
                    </ul>
                </div>

                <div id="map" class="discovery__map col-8">
                    <img src="./images/mapview.jpg" alt="a map with locations" id="mapView" class="placeholder"/>
                    <span class="placeholder">Result map</span>
                </div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <span>(c) 2021/22 HKA_IWI_VSYS</span>
    </footer>

<!-- Load JavaScripts
    ================================================== -->
    <!-- Placed at the end of the document so the pages load faster -->
    <script src="./javascripts/geotagging.js"></script>
</body>

</html>
